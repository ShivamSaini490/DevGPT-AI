services:
  backend:
    build:
      target: runtime
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/backend/app
    working_dir: /app
    environment:
      DEBUG: "true"
    volumes:
      - ./backend:/app/backend
      - uploads_data:/app/backend/uploads

  # React/Vite dev server with hot reload: http://localhost:5173
  frontend:
    image: node:24-slim
    working_dir: /app/frontend
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8080
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
