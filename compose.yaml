name: devgpt

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Keep local Docker credentials independent from any hosted PostgreSQL
      # settings stored in backend/.env.
      POSTGRES_DB: devgpt
      POSTGRES_USER: devgpt
      POSTGRES_PASSWORD: devgpt_local_password
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: devgpt
      POSTGRES_USER: devgpt
      POSTGRES_PASSWORD: devgpt_local_password
      # The bundled local PostgreSQL container does not expose TLS. Override
      # any production SSL settings that may be present in backend/.env.
      POSTGRES_SSLMODE: disable
      POSTGRES_CHANNEL_BINDING: disable
      USE_POSTGRES_COMPONENTS: "true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
